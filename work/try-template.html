<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>NPU 大模型拼音</title>
<style>body{font:17px system-ui;max-width:900px;margin:70px auto;padding:20px;background:#f5f7fb;color:#192335}h1{font-size:30px}textarea,input{box-sizing:border-box;width:100%;padding:18px;border:1px solid #ccd4e0;border-radius:10px;font:inherit;background:white}textarea{height:180px}label{display:block;margin:20px 0 9px}button{font:inherit;padding:12px 16px;margin:6px;border:1px solid #bbc9db;border-radius:9px;background:white;cursor:pointer}button:hover{background:#e8f0ff}button:disabled{opacity:.5}#status{color:#586b83;min-height:26px;margin:14px 0}.muted{color:#586b83;font-size:14px}</style>
<h1>NPU 大模型拼音 · Qwen3 1.7B</h1><p>输入拼音，候选直接来自本地模型。选中的文字会成为后续输入的上下文。</p>
<label for="output">已提交文字</label><textarea id="output" readonly placeholder="选词后显示在这里"></textarea>
<label for="context">上下文（可修改后按应用）</label><input id="context" placeholder="例如：医生建议我每天按时吃"><button id="apply">应用上下文</button><label for="keys">拼音</label><input id="keys" autocomplete="off" spellcheck="false" placeholder="切到英文键盘，试试 nihao 或 nihaoshijie" autofocus>
<div id="status" aria-live="polite">准备就绪</div><div id="candidates"></div>
<p class="muted">空格选首项 · 数字 1–9 选词 · Esc 清空拼音 · 支持退格。当前为网页试打，模型推理使用本机 Hexagon NPU。</p>
<script>
const key='__LOCAL_KEY__';const input=document.querySelector('#keys'),out=document.querySelector('#output'),bar=document.querySelector('#candidates'),status=document.querySelector('#status');
let candidates=[],busy=false,shown='',pendingSelect=false;
async function api(path,data){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify(data)});if(!r.ok)throw Error('服务返回 '+r.status);return r.json()}
function render(){bar.replaceChildren();candidates.slice(0,9).forEach((c,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' '+c.word;b.disabled=busy;b.onclick=()=>choose(i);bar.append(b)})}
async function refresh(){if(busy)return;busy=true;render();try{while(shown!==input.value){const keys=input.value;const t=performance.now();status.textContent='计算候选…';const r=keys?await api('candidates',{keys,context:out.value}):{candidates:[]};if(keys!==input.value)continue;candidates=r.candidates;shown=keys;status.textContent=keys?`${Math.round(performance.now()-t)} ms · ${candidates.length} 个候选`:'准备就绪';}}catch(e){status.textContent=e.message;candidates=[];shown=input.value}finally{busy=false;render();if(pendingSelect){pendingSelect=false;choose(0)}}}
async function choose(index){if(busy){if(index===0)pendingSelect=true;return}if(shown!==input.value)return;const c=candidates[index];if(!c)return;busy=true;input.disabled=true;render();try{await api('commit',{text:c.word,new:true,context:out.value});out.value+=c.word;input.value=input.value.slice(c.consumedkeys);shown='';candidates=[];status.textContent='准备就绪'}catch(e){status.textContent=e.message}finally{busy=false;input.disabled=false;input.focus();render();refresh()}}
document.querySelector('#apply').onclick=async()=>{if(busy)return;busy=true;try{const text=document.querySelector('#context').value;await api('context',{text});out.value=text;shown='';status.textContent='上下文已更新 · HTP0 NPU'}catch(e){status.textContent=e.message}finally{busy=false;refresh()}};
input.addEventListener('input',()=>refresh());input.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();choose(0)}else if(/^[1-9]$/.test(e.key)&&input.value){e.preventDefault();choose(+e.key-1)}else if(e.key==='Escape'){e.preventDefault();input.value='';refresh()}});
</script></html>
