<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>语流 · 本地大模型输入</title>
<style>body{font:16px system-ui;max-width:900px;margin:48px auto;padding:20px;background:#fafafa;color:#222}h1{font-size:26px;font-weight:600}textarea,input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #ddd;border-radius:6px;font:inherit;background:white}textarea{height:200px;line-height:1.6}label{display:block;margin:20px 0 8px}button{font:inherit;padding:8px 12px;margin:4px;border:1px solid #ddd;border-radius:5px;background:white;cursor:pointer}button:hover{background:#eee}button:disabled{opacity:.5}#status,.muted{color:#777;font-size:13px;line-height:1.6}#status{min-height:25px;margin:14px 0}details{margin-top:30px;border-top:1px solid #ddd;padding-top:15px}li{margin:6px 0}#context{margin-top:10px}</style>
<h1>语流</h1><p class="muted">Qwen3 1.7B · Hexagon NPU · 本地候选</p>
<label for="output">正文</label><textarea id="output" placeholder="可以直接编辑正文、移动光标或选中文字，然后输入拼音。"></textarea>
<label for="keys">拼音</label><input id="keys" autocomplete="off" spellcheck="false" placeholder="nihao · nh · shurufa" autofocus>
<div id="status" aria-live="polite">准备就绪</div><div id="candidates"></div>
<p class="muted">空格选首项 · 数字 1–9 选词 · Esc 清空。候选使用正文光标前后文字；选词会替换正文中选中的文字。</p>
<details><summary>上下文与本地学习</summary><input id="context" placeholder="设置测试上下文"><button id="apply">应用上下文</button><p class="muted">学习只记录明确选中的拼音与词语，不保存正文。可以暂停、删除或撤销最近一次学习。</p><button id="show">查看学习</button><button data-action="undo">撤销一次</button><button data-action="pause">暂停</button><button data-action="resume">恢复</button><button data-action="clear">清空</button><div id="learning"></div></details>
<script>
const key='__LOCAL_KEY__',input=document.querySelector('#keys'),out=document.querySelector('#output'),bar=document.querySelector('#candidates'),status=document.querySelector('#status');
const session='web-'+crypto.randomUUID();let candidates=[],version=0,current=null,committing=false,selection=[0,0],freeze=false,latestCandidates=null;
async function api(path,data){const r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},...(data===undefined?{}:{body:JSON.stringify(data)})});if(!r.ok)throw Error('服务返回 '+r.status);const value=await r.json();if(value.error)throw Error(value.error);return value}
function context(){const [a,b]=selection;return {context:Array.from(out.value.slice(0,a)).slice(-256).join(''),after:out.value.slice(b, b+128),surrounding:true}}
function render(){bar.replaceChildren();candidates.slice(0,9).forEach((c,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' '+c.word+(c.correction?' · 纠错':'');b.disabled=committing;b.onclick=()=>choose(i,c);bar.append(b)})}
async function refresh(){if(committing)return;const v=++version,keys=input.value,ctx=context();current={v,keys,ctx,job:null,pending:false};latestCandidates=null;candidates=[];render();if(!keys){status.textContent='准备就绪';return}const start=performance.now();try{let r=await api('candidates',{keys,...ctx,progressive:true,session});if(v!==version)return;current.job=r.job;current.pending=r.pending;latestCandidates=r.candidates;if(!freeze){candidates=r.candidates;render()};status.textContent=`首批 ${Math.round(performance.now()-start)} ms${r.pending?' · 搜索中':''}`;while(r.pending){await new Promise(resolve=>setTimeout(resolve,80));if(v!==version)return;r=await api('results/'+r.job);if(v!==version)return;current.pending=r.pending;latestCandidates=r.candidates;if(!freeze){candidates=r.candidates;render()}}status.textContent=`完成 ${Math.round(performance.now()-start)} ms · ${candidates.length} 个候选`;}catch(e){if(v===version){status.textContent=e.message;candidates=[];render()}}}
async function choose(index,displayed=null){if(committing||!current||current.keys!==input.value)return;const selectionVersion=version;try{let c=displayed??candidates[index];if(index===0&&!displayed&&current.pending){const r=await api('results/'+current.job+'?wait=1');if(version!==selectionVersion)return;candidates=r.candidates;c=candidates[0];}if(!c)return;committing=true;++version;input.disabled=true;render();const [a,b]=selection,before=out.value.slice(0,a);await api('commit',{text:c.word,context:before,keys:input.value.slice(0,c.consumedkeys),selected:true});out.setRangeText(c.word,a,b,'end');selection=[a+c.word.length,a+c.word.length];input.value=input.value.slice(c.consumedkeys);candidates=[];}catch(e){status.textContent=e.message}finally{committing=false;input.disabled=false;input.focus();refresh()}}
bar.addEventListener('pointerenter',()=>freeze=true);bar.addEventListener('pointerleave',()=>{freeze=false;if(latestCandidates){candidates=latestCandidates;render()}});
function capture(){selection=[out.selectionStart,out.selectionEnd];if(input.value)refresh()}
out.addEventListener('select',capture);out.addEventListener('input',capture);out.addEventListener('click',capture);out.addEventListener('keyup',capture);
input.addEventListener('input',refresh);input.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();choose(0)}else if(/^[1-9]$/.test(e.key)&&input.value){e.preventDefault();choose(+e.key-1)}else if(e.key==='Escape'){e.preventDefault();input.value='';refresh()}});
document.querySelector('#apply').onclick=async()=>{if(committing)return;out.value=document.querySelector('#context').value;selection=[out.value.length,out.value.length];out.setSelectionRange(...selection);await api('context',{text:out.value});refresh()};
function learning(data){const el=document.querySelector('#learning');el.replaceChildren();const p=document.createElement('p');p.textContent=data.enabled?'学习中':'已暂停';el.append(p);for(const entry of data.entries){const row=document.createElement('div');row.textContent=entry.keys+' → '+entry.word+' · '+entry.count+' 次 ';const b=document.createElement('button');b.textContent='删除';b.onclick=async()=>{learning(await api('learning',{action:'remove',id:entry.id}));refresh()};row.append(b);el.append(row)}}
document.querySelector('#show').onclick=async()=>learning(await api('learning'));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{learning(await api('learning',{action:b.dataset.action}));refresh()});
</script></html>
